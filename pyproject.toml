[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-identity"
version = "1.0.0"
description = "Zero-Trust SPIFFE Workload Identity for Autonomous Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "cryptography>=42.0.8",
    "python-multipart>=0.0.9",
    "structlog>=24.2.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.10",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "pre-commit>=3.7.1",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_identity"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "cryptography.*",
    "asyncpg.*"
]
ignore_missing_imports = true
